name: Build apps

# Installable apps for every platform:
#   macOS   .dmg and .zip for Apple Silicon (arm64) and Intel (x64)
#   Linux   .deb and .AppImage for x64 and arm64 (also Chromebooks with Linux turned on, and
#           Googlebooks: the .deb carries `openedits-web`, the editor served to the browser)
#   Windows installer (.exe, x64)
# Each build bundles FFmpeg and ffprobe, and checks that the packaged engine starts and finds them.
# The files are attached to the run as artifacts; pushing a tag like v0.1.0 also publishes a release.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb espeak-ng
      - run: npm ci
      - name: Build and test (the desktop tests drive the real app in a virtual display)
        run: xvfb-run -a npm test

  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            tools: "darwin:arm64 darwin:x64"
            dist: --mac --arm64 --x64
            app: "release/dist/mac-arm64/OpenEdits Studio.app/Contents/MacOS/OpenEdits Studio"
            resources: "release/dist/mac-arm64/OpenEdits Studio.app/Contents/Resources"
            files: |
              release/dist/*.dmg
              release/dist/*.zip
          - name: Linux
            os: ubuntu-latest
            tools: "linux:x64 linux:arm64"
            dist: --linux --x64 --arm64
            app: release/dist/linux-unpacked/openedits-studio
            resources: release/dist/linux-unpacked/resources
            files: |
              release/dist/*.deb
              release/dist/*.AppImage
          - name: Windows
            os: windows-latest
            tools: "win32:x64"
            dist: --win --x64
            app: "release/dist/win-unpacked/OpenEdits Studio.exe"
            resources: release/dist/win-unpacked/resources
            files: |
              release/dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch FFmpeg, ffprobe (and the Apple Vision helper on macOS)
        shell: bash
        run: |
          for target in ${{ matrix.tools }}; do
            node scripts/fetch-tools.mjs --platform "${target%%:*}" --arch "${target##*:}"
          done
      - name: Build installers
        shell: bash
        run: npm run dist -- ${{ matrix.dist }}
      - name: Smoke test the packaged engine and its bundled tools
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          RES="${{ matrix.resources }}"
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          "$RES/vendor/ffmpeg$EXE" -hide_banner -version | head -1
          OUT=$(OPENEDITS_WORKSPACE="$RUNNER_TEMP/ws" OPENEDITS_FFMPEG="$RES/vendor/ffmpeg$EXE" OPENEDITS_FFPROBE="$RES/vendor/ffprobe$EXE" \
            "${{ matrix.app }}" "$RES/app/engine/cli.mjs" doctor)
          echo "$OUT"
          echo "$OUT" | grep -q "^ok   ffmpeg"
          echo "$OUT" | grep -q "^ok   ffprobe"
          echo "$OUT" | grep -q "^ok   H.264 encoder"
      - name: Install the .deb and check the browser mode a Googlebook uses (no display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ./release/dist/OpenEdits-Studio-*-linux-amd64.deb
          env -u DISPLAY -u WAYLAND_DISPLAY OPENEDITS_WORKSPACE="$RUNNER_TEMP/web-ws" openedits-web > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do grep -q "token=" "$RUNNER_TEMP/web.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/web.log"
          LINK=$(grep -o "http://localhost:[0-9]*/?token=[0-9a-f]*" "$RUNNER_TEMP/web.log")
          test "$(curl -s -o /dev/null -w '%{http_code}' "${LINK%%\?*}")" = 401
          curl -sf -c "$RUNNER_TEMP/jar" -o /dev/null "$LINK"
          PAGE=$(curl -sf -b "$RUNNER_TEMP/jar" "${LINK%%\?*}")
          echo "$PAGE" | grep -q app.js
          MANIFEST=$(curl -sf "${LINK%%\?*}manifest.webmanifest")
          echo "$MANIFEST" | grep -q OpenEdits
          # The engine's compositor draws a frame with no display server.
          engine() {
            env -u DISPLAY -u WAYLAND_DISPLAY OPENEDITS_WORKSPACE="$RUNNER_TEMP/web-ws" ELECTRON_RUN_AS_NODE=1 OPENEDITS_ELECTRON="/opt/OpenEdits Studio/openedits-studio" \
              "/opt/OpenEdits Studio/openedits-studio" "/opt/OpenEdits Studio/resources/app/engine/cli.mjs" "$@"
          }
          engine call newProject '{}' > /dev/null
          engine call addText '{"text":"Googlebook","start":0,"duration":2}' > /dev/null
          FRAME=$(engine call captureFrame '{"time":0.5}')
          echo "$FRAME" | grep '"path"'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: OpenEdits-Studio-Googlebook
          path: release/dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OpenEdits-Studio-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "OpenEdits Studio $GITHUB_REF_NAME" --generate-notes
